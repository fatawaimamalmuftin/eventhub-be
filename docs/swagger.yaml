basePath: /
definitions:
  dto.Account:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  dto.Res:
    properties:
      data: {}
      message:
        type: string
      status:
        type: boolean
    type: object
host: localhost:5678
info:
  contact: {}
  description: This is a sample server celler server.
  title: EventHub BE
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: login need token
      parameters:
      - description: Login credential
        in: body
        name: account
        required: true
        schema:
          $ref: '#/definitions/dto.Account'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Res'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Res'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Res'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Res'
      summary: Login
      tags:
      - login
securityDefinitions:
  BasicAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
